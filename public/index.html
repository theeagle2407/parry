;transition:border-color .15s,transform .15s}.card:hover{border-color:#81b8a9;transform:translateY(-2px)}.card-top{display:flex;align-items:center;gap:12px;margin-bottom:23px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--mint);font-weight:700}.badge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--mint);color:#267768;margin-left:auto}.card h2{font-size:22px;margin-bottom:9px}.card p{margin:0 0 25px;color:var(--muted);max-width:480px}.card-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:19px;display:flex;justify-content:space-between;font-size:13px}.card-foot strong{font-size:16px}.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:45px;align-items:start}.panel{border:1px solid var(--line);border-radius:12px;padding:27px;background:white;margin-bottom:22px}.panel p{white-space:pre-wrap}.panel ol{padding-left:23px}.panel li{padding:7px 0}.side{position:sticky;top:25px}.side button{width:100%;margin-top:18px}.row{display:flex;justify-content:space-between;gap:15px;margin:17px 0}.back{display:inline-block;margin-bottom:25px;color:var(--muted);text-decoration:none}input,select,textarea{width:100%;padding:11px 13px;border:1px solid #d7e1de;border-radius:7px;background:white;color:var(--ink)}textarea{min-height:110px;resize:vertical}label{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}.form{max-width:700px;margin:auto}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:25px}.notice{border-left:3px solid #87b8a9;padding:9px 15px;font-size:13px;color:var(--muted);margin:22px 0}.empty{padding:60px 20px;text-align:center;border:1px dashed #cddbd5;border-radius:10px}.review{border-bottom:1px solid var(--line);padding:20px 0}.review:last-child{border:0}.previews{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.previews img{display:block;width:120px;height:90px;object-fit:cover;border-radius:7px}.previews button{font-size:12px;padding:4px 9px}.award-row{display:flex;gap:8px;margin-bottom:10px}.award-row input{min-width:0}.chain-status{font-size:13px;margin:15px 0;overflow-wrap:anywhere}.review p{margin:8px 0}.stars{color:#947428}.mini{font-size:12px}footer{max-width:1250px;margin:55px auto 20px;padding:0 30px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}dialog{border:1px solid var(--line);border-radius:16px;padding:32px;width:min(440px,calc(100% - 32px));color:var(--ink)}dialog::backdrop{background:#102c2c70;backdrop-filter:blur(3px)}dialog button{width:100%;margin-top:12px}#error{color:#a43c30;font-size:14px}.toast{max-width:min(640px,calc(100vw - 32px));overflow-wrap:anywhere;max-height:35vh;overflow:auto;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:9px;z-index:5}@media(max-width:760px){.nav{padding:18px 20px;gap:18px}.nav .nav-extra{display:none}.wrap{margin:32px auto;padding:0 20px}.grid,.detail{grid-template-columns:1fr}.side{position:static}.top{align-items:flex-start}h1{font-size:27px}.search{width:100%;margin:10px 0 0}.card{padding:24px}.nav button{font-size:12px;padding:8px 11px}footer{padding:0 20px;gap:15px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script type="module">
import {BrowserProvider,JsonRpcProvider,ZeroAddress,ZeroHash,Contract,ContractFactory,parseUnits,formatUnits,id as hashText} from "/ethers.js";
import {challengePhase,submissionAccess} from '/workflow.js';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const examples=[{id:'northstar',team:'Northstar',title:'Try our new booking experience',type:'Product review',description:'Book an appointment and tell us where the experience could be clearer.',tasks:['Choose a service and find an available time.','Walk through the booking steps.','Describe anything confusing or missing.'],reward:500},{id:'folio',team:'Folio',title:'Help improve our first-time setup',type:'Usability test',description:'Review the setup flow for a workspace designed for independent creators.',tasks:['Review the welcome and setup flow.','Identify any unfamiliar wording.','Suggest one change that would help a new user.'],reward:300},{id:'atlas',team:'Atlas',title:'Review our mobile account recovery',type:'Product review',description:'Assess the clarity of the recovery steps, messages and support options.',tasks:['Review the recovery instructions.','Identify where you would need help.','Explain what would make you feel confident.'],reward:400},{id:'nova',team:'Nova',title:'Assess our vault integration plan',type:'Technical review',description:'Examine the withdrawal assumptions and document any constraints.',tasks:['Read the proposed integration.','Identify an assumption that needs verification.','Attach a source or steps to reproduce your finding.'],reward:750}].map(x=>({...x,example:true,owner:'',url:'/product.html?mode='+x.id,audience:'People trying this product for the first time. No technical experience is required.',criteria:'Specific observations, clear steps and practical suggestions. Positive and critical feedback are equally eligible.',duration:'10–15 minutes',createdAt:new Date().toISOString()}));
let state;try{state=JSON.parse(localStorage.getItem('parry.v1'))||{studies:[],reviews:[],joins:[]}}catch{state={studies:[],reviews:[],joins:[]}}let account='',filter='All',query='',pending=null;
function save(){try{cachePrivateState();setTimeout(()=>syncShared(true),0);return true}catch{alert('Storage is unavailable or full. Your changes could not be saved.');return false}}
function toast(t){const el=document.createElement('div');el.className='toast transient-toast';el.role='status';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),3500)}
function studies(){const ids=new Set(state.studies.map(s=>s.id)),fundedTemplates=new Set(state.studies.filter(s=>s.chainId).map(s=>s.originTemplate));return [...state.studies,...examples.filter(s=>!ids.has(s.id)&&!fundedTemplates.has(s.id))]}function study(id){return studies().find(s=>s.id===id)}function address(){return account.slice(0,6)+'…'+account.slice(-4)}
async function gate(fn){if(account){try{await privateSignIn();return await fn()}catch(e){toast(e.code===4001||e.code==='ACTION_REJECTED'?'Sign-in cancelled.':e.message);return}}pending=fn;$('#error').textContent='';$('#wallet').showModal()}
$('#cancel').onclick=()=>$('#wallet').close();$('#wallet').addEventListener('close',()=>pending=null);
$('#connect').onclick=connectAndSignIn;
window.ethereum?.on?.('accountsChanged',async a=>{account=a[0]?.toLowerCase()||'';resetPrivateIdentity();render();if(account&&!connectionBusy){try{await privateSignIn();updateWalletHeader()}catch(e){toast(e.message)}}});$('#create').onclick=()=>gate(()=>location.hash='create');
function card(s){return `<a class="card" href="#review/${encodeURIComponent(s.id)}"><div class="card-top"><span class="avatar">${esc(s.team[0])}</span><span class="team-name">${esc(s.team)}</span>${s.example?'<span class="phase">Open</span>':phaseBadge(s)}</div><div class="card-content"><span class="review-type">${esc(s.type)}</span><h2>${esc(s.title)}</h2><p>${esc(s.description)}</p><p class="mini muted">${winnerLabel(s)}</p></div><div class="card-foot"><div><span class="prize-label">${s.example?'Proposed prize pool':'Prize pool'}</span><strong>${s.chainId?esc(String(s.reward)):Number(s.reward).toLocaleString('en-US')}<span class="asset-unit">${s.chainId?' '+esc(s.assetSymbol||'ETH'):' USDG'}</span></strong></div><span class="deadline">${s.chainId?esc(deadlineLabel(s)):'Explore challenge'}<span class="card-arrow" aria-hidden="true">↗</span></span></div></a>`}
function explore(){
 $('#app').innerHTML=`<div class="top"><div><span class="eyebrow">DISCOVER</span><h1>${location.hash==='#history'?'History':'Challenges'}</h1><p class="muted page-description">${location.hash==='#history'?'Earlier challenges and their payment records.':'Explore products. Share useful feedback.'}</p></div><span class="muted mini" id="challenge-count"></span></div><div class="catalog-toolbar"><div class="status-tabs" aria-label="Review type">${['All','Product review','Usability test','Technical review'].map(x=>`<button data-type="${x}" class="${filter===x?'active':''}" aria-pressed="${filter===x}">${x==='All'?'All challenges':x}</button>`).join('')}</div><div class="catalog-controls"><input class="search" aria-label="Search challenges" placeholder="Search products or teams" value="${esc(query)}"><button id="refresh-challenges" class="icon-button" aria-label="Refresh challenge status" title="Refresh status">↻</button></div></div><div class="grid" id="cards"></div>`;
 challengeFilter='all';updateChallengeCards();document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{filter=b.dataset.type;explore()});$('.search').oninput=e=>{query=e.target.value;updateChallengeCards()};$('#refresh-challenges').onclick=()=>refreshCatalog(true);refreshCatalog();
}

function fundedDetail(s){if(!s)return missing();const joined=state.joins.includes(`${account}:${s.id}`),reviews=state.reviews.filter(r=>r.study===s.id&&privateIdentity===account&&account&&(r.author.toLowerCase()===account||s.owner?.toLowerCase()===account));$('#app').innerHTML=`<a class="back" href="#">← Explore reviews</a><div class="top"><div><small>${esc(s.team)} / ${esc(s.type)}</small><h1>${esc(s.title)}</h1></div></div><div class="detail"><div><section class="panel"><h2>About this review</h2><p>${esc(s.description)}</p><h3>Who should participate</h3><p>${esc(s.audience||"People familiar with the intended use of this product.")}</p><h3>What useful feedback looks like</h3><p>${esc(s.criteria||"Describe what you tried, what happened and what you would change. Include evidence where useful.")}</p><div class="row"><span class="muted">Estimated time</span><span>${esc(s.duration||"10–15 minutes")}</span></div>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open product ↗</a>`:''}<h3>What to try</h3><ol>${s.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>${s.example?'<details class="mini muted"><summary>About this preview</summary>Fictional product walkthrough. No funded rewards.</details>':''}</section><section class="panel" id="submission-list"><h2>${account&&s.owner?.toLowerCase()===account?'Submissions':'Your submission'} <small>(${reviews.length})</small></h2>${reviews.map(r=>`<article class="review"><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><h3>${esc(r.title)}</h3><p>${esc(r.observation)}</p><p><strong>Suggestion:</strong> ${esc(r.suggestion)}</p>${(r.screenshots||[]).map(x=>`<a href="${esc(x.data)}" target="_blank" rel="noopener"><img style="max-width:140px;max-height:100px;margin:8px;border-radius:6px" src="${esc(x.data)}" alt="${esc(x.name)}"></a>`).join('')}${r.evidence?`<a href="${esc(r.evidence)}" target="_blank" rel="noopener noreferrer">View evidence ↗</a>`:''}<div class="mini muted">${esc(r.author.slice(0,6))}…${esc(r.author.slice(-4))} · ${new Date(r.createdAt).toLocaleDateString()}</div></article>`).join('')||'<p class="muted">'+(privateIdentity===account&&account?'No submissions to display.':'Sign in to view submissions available to you.')+'</p>'}</section></div><aside class="panel side"><small>${s.chainId?"Prize pool · "+esc(s.assetSymbol||"pUSD"):"Prize pool"}</small><h1>${s.chainId?"":"$"}${esc(String(s.reward))}${s.chainId?" "+esc(s.assetSymbol||"pUSD"):""}</h1><div class="row"><span class="muted">Review type</span><span>${esc(s.type)}</span></div><div class="row"><span class="muted">Team</span><span>${esc(s.team)}</span></div><button class="primary" id="join" disabled>Checking availability…</button><p class="mini muted">Useful feedback is welcome, positive or critical.</p><p class="mini muted">${s.chainId?"":"Create and fund a review to offer onchain rewards."}</p><div id="chainpanel"></div></aside></div>`;if(s.fundingTx)document.querySelector('.side').insertAdjacentHTML('beforeend',`<p class="mini"><a target="_blank" rel="noopener" href="https://sepolia.arbiscan.io/tx/${esc(s.fundingTx)}">Funding transaction ↗</a></p>`);if(s.chainId)loadPool(s);$('#join').onclick=()=>gate(async()=>{await ensureCanSubmit(s);if(!state.joins.includes(`${account}:${s.id}`)){state.joins.push(`${account}:${s.id}`);if(!save())return}location.hash=`write/${s.id}`})}
function validUrl(v){if(!v)return '';const u=new URL(v);if(!['https:','http:'].includes(u.protocol))throw Error('Use an http or https link.');return u.href}
function renderWriteForm(s){if(!s)return missing();if(!account){detail(s);return}$('#app').innerHTML=`<div class="form"><a class="back" href="#review/${s.id}">← Back to brief</a><h1>Write a review</h1><p class="muted">${esc(s.title)}</p><form id="reviewform"><label for="rating">Your experience</label><select id="rating" name="rating"><option value="5">5 · Excellent</option><option value="4">4 · Good</option><option value="3" selected>3 · Mixed</option><option value="2">2 · Difficult</option><option value="1">1 · Unusable</option></select><label for="title">Summary</label><input id="title" name="title" required maxlength="120" placeholder="What stood out?"><label for="observation">What did you try, and what happened?</label><textarea id="observation" name="observation" required maxlength="4000"></textarea><label for="suggestion">What would you improve?</label><textarea id="suggestion" name="suggestion" required maxlength="4000"></textarea><label for="screens">Screenshots</label><input id="screens" type="file" accept="image/png,image/jpeg,image/webp" multiple><small>Up to 3 images, 2 MB each. Preview and remove before submitting.</small><div id="previews" class="previews"></div><label for="evidence">Evidence link <span class="muted">(optional)</span></label><input id="evidence" name="evidence" type="url" placeholder="https://"><p class="mini muted">Your submission and screenshots are visible to you and the review creator.</p><div class="actions"><button type="button" id="back">Cancel</button><button class="primary">Submit review</button></div></form></div>`;$('#back').onclick=()=>location.hash=`review/${s.id}`;let images=[];$('#screens').onchange=async e=>{try{images=await prepareImages(e.target.files);drawImages()}catch(err){toast(paymentError(err));e.target.value=''}};function drawImages(){$('#previews').innerHTML=images.map((x,i)=>`<div><img src="${x.data}" alt="${esc(x.name)}"><button type="button" data-remove="${i}">Remove</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{images.splice(Number(b.dataset.remove),1);drawImages()})};$('#reviewform').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button.primary');if(button.disabled)return;button.disabled=true;const d=Object.fromEntries(new FormData(e.target));try{const submittingWallet=await ensureCanSubmit(s);d.evidence=validUrl(d.evidence);if(!d.title.trim()||!d.observation.trim()||!d.suggestion.trim())throw Error('Please complete all required fields.');const review={...d,screenshots:images,rating:Number(d.rating),study:s.id,author:account,createdAt:new Date().toISOString(),id:crypto.randomUUID()};try{if(s.chainId){const {pool}=await contracts(s);const funded=await pool.pools(s.chainId);const {briefHash,fundingTx,...bound}=s;if(funded.briefHash!==hashText(JSON.stringify(bound)))throw Error('Brief does not match the funded record.');if(account!==submittingWallet)throw Error('Wallet changed. Reopen the challenge.');review.author=submittingWallet;review.contentHash=hashText(JSON.stringify(review));localStorage.setItem('parry.pendingReview',JSON.stringify(review));await transact(sendWithGas(pool.submit,[s.chainId,review.contentHash]),'Submitting review');}state.reviews.push(review);}finally{button.disabled=false;}if(save()){location.hash=`review/${s.id}`;localStorage.removeItem('parry.pendingReview');toast('Review saved')}}catch(err){toast(paymentError(err))}finally{button.disabled=false}}}
function renderCreateForm(){if(!account){explore();return}$('#app').innerHTML=`<div class="form"><a class="back" href="#">← Explore reviews</a><h1>Create a challenge</h1><form id="newform"><label>Team<input name="team" required maxlength="60"></label><label>Title<input name="title" required maxlength="120" placeholder="What would you like people to review?"></label><label>Review type<select name="type"><option>Product review</option><option>Usability test</option><option>Technical review</option></select></label><label>Product link<input type="url" name="url" placeholder="https://"></label><label>Brief<textarea name="description" required maxlength="4000"></textarea></label><label>Tasks <span class="muted">(one per line)</span><textarea name="tasks" required maxlength="2000"></textarea></label><label>Who should participate?<textarea name="audience" required maxlength="1000"></textarea></label><label>How will winners be selected?<textarea name="criteria" required maxlength="1500" placeholder="Specificity, supporting evidence and actionable suggestions. Ratings do not determine rewards."></textarea></label><label>Estimated time<input name="duration" value="10–15 minutes" maxlength="60"></label><label>Submission deadline<input type="datetime-local" name="deadline" required></label><label>Prize pool (${esc(chainConfig.symbol||"ETH")})<input name="reward" type="number" min="0.000001" max="1000000" step="any" value="${chainConfig.symbol==='USDG'?'10':'0.001'}" required></label><div class="notice">Confirm funding in your wallet. Token payments may require an allowance approval first. A transaction link appears when submitted. The creator selects winners after the deadline; unresolved pools become refundable after 7 days.</div><div class="actions"><button class="primary">Fund & create challenge</button></div></form></div>`;$('#newform').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{d.url=validUrl(d.url);const tasks=d.tasks.split('\n').map(t=>t.trim()).filter(Boolean);if(!tasks.length||!d.title.trim()||!d.team.trim()||!d.description.trim())throw Error('Please complete all required fields.');const s={...d,tasks,reward:d.reward.trim(),id:crypto.randomUUID(),owner:account,createdAt:new Date().toISOString()};const button=e.target.querySelector('button');button.disabled=true;try{await fundStudy(s);state.studies.unshift(s);}finally{button.disabled=false;}if(save()){location.hash=`review/${s.id}`;localStorage.removeItem('parry.pendingFunding');toast('Review funded')}}catch(err){toast(paymentError(err))}}}
function activity(){
 const signed=account&&privateIdentity===account;
 const mine=signed?state.reviews.filter(r=>r.author.toLowerCase()===account):[],owned=state.studies.filter(s=>account&&s.owner.toLowerCase()===account);
 $('#app').innerHTML=`<div class="top"><div><span class="eyebrow">YOUR ACCOUNT</span><h1>My activity</h1></div></div>${!signed?'<section class="empty"><h2>Your challenges and submissions</h2><p>Connect and sign in to view your activity.</p><button id="activityconnect" class="primary">'+(account?'Continue sign-in':'Connect wallet')+'</button></section>':`<section class="panel"><h2>Your challenges <span class="muted mini">${owned.length}</span></h2>${owned.map(s=>`<a class="activity-row" href="#review/${encodeURIComponent(s.id)}"><div><strong>${esc(s.title)}</strong><span>${esc(s.team)} · ${esc(s.type)}</span></div><span>${esc(s.reward)} ${esc(s.assetSymbol||'ETH')}</span></a>`).join('')||'<p class="muted">Your funded challenges will appear here.</p>'}</section><section class="panel"><h2>Your submissions <span class="muted mini">${mine.length}</span></h2>${mine.map(r=>`<a class="activity-row" href="#review/${encodeURIComponent(r.study)}"><div><strong>${esc(r.title)}</strong><span>${esc(study(r.study)?.title||'Challenge')}</span></div><span class="phase phase-open">Submitted</span></a>`).join('')||'<p class="muted">You have not submitted a review yet.</p>'}</section><details class="recovery"><summary>Missing an interrupted submission?</summary><p>If your transaction confirmed but the submission was interrupted, recover its saved record.</p><button id="recover">Recover submission</button></details>`}`;
 $('#activityconnect')?.addEventListener('click',()=>gate(activity));$('#recover')?.addEventListener('click',recoverPending);
}

function missing(){$('#app').innerHTML='<h1>Review not found</h1><a href="#">Return to explore</a>'}
function render(){resetPrivateIdentity();updateWalletHeader();const [route,id]=location.hash.slice(1).split('/');if(route==='review')detail(study(id));else if(route==='write')write(study(id));else if(route==='create')create();else if(route==='history')explore();else if(route==='activity')activity();else if(route==='about')howItWorks();else if(route==='profile')profile();else explore();polishPage()}
const chainHex='0x66eee';
let chainConfig={};try{const response=await fetch('/config.json');if(response.ok)chainConfig=await response.json()}catch{}
async function network(){if(!window.ethereum)throw Error('Connect an Ethereum browser wallet first.');try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:chainHex}]})}catch(e){if(e.code!==4902)throw e;await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:chainHex,chainName:'Arbitrum Sepolia',nativeCurrency:{name:'Ether',symbol:'ETH',decimals:18},rpcUrls:['https://sepolia-rollup.arbitrum.io/rpc'],blockExplorerUrls:['https://sepolia.arbiscan.io']}]})}const provider=new BrowserProvider(window.ethereum);const signer=await provider.getSigner();if(Number((await provider.getNetwork()).chainId)!==421614)throw Error('Switch to Arbitrum Sepolia.');account=(await signer.getAddress()).toLowerCase();return {provider,signer}}
async function artifact(name){const res=await fetch(`/artifacts/${name}.json`);if(!res.ok)throw Error('Run npm run build to compile the contracts.');return res.json()}
async function contracts(s){const c=s?.poolAddress?{pool:s.poolAddress,token:s.tokenAddress}:chainConfig;if(!/^0x[a-fA-F0-9]{40}$/.test(c.pool||'')||!/^0x[a-fA-F0-9]{40}$/.test(c.token||''))throw Error('The platform reward contract has not been configured. No payment was requested.');const {provider,signer}=await network();if(await provider.getCode(c.pool)==='0x')throw Error('No reward contract exists at the configured address on Arbitrum Sepolia.');const pool=new Contract(c.pool,(await artifact('ReviewPool')).abi,signer);const token=c.token===ZeroAddress?null:new Contract(c.token,['function decimals() view returns(uint8)','function symbol() view returns(string)','function balanceOf(address) view returns(uint256)','function allowance(address,address) view returns(uint256)','function approve(address,uint256) returns(bool)'],signer);if((await pool.token()).toLowerCase()!==c.token.toLowerCase())throw Error('Pool and token addresses do not match.');return {provider,signer,pool,token,decimals:token?Number(await token.decimals()):18,symbol:token?await token.symbol():'ETH'}}

async function sendWithGas(method,args,overrides={}){
 const estimate=await method.estimateGas(...args,overrides);
 const provider=new BrowserProvider(window.ethereum);
 const [chain,priceHex,block]=await Promise.all([provider.send('eth_chainId',[]),provider.send('eth_gasPrice',[]),provider.send('eth_getBlockByNumber',['latest',false])]);
 if(BigInt(chain)!==421614n)throw Error('Switch your wallet to Arbitrum Sepolia.');
 const price=BigInt(priceHex),base=BigInt(block?.baseFeePerGas||priceHex);
 const maxFeePerGas=(price>base?price:base)*2n;
 if(maxFeePerGas<=0n)throw Error('Network fee estimate unavailable. Please try again.');
 return method(...args,{...overrides,gasLimit:(estimate*150n+99n)/100n,maxFeePerGas,maxPriorityFeePerGas:0n});
}

function paymentError(e){recordWalletFailure(e);if(e.code==='UNKNOWN_ERROR'){const reason=e.info?.error?.message||e.error?.message;return reason?String(reason).slice(0,220):'Your wallet or RPC could not complete the request. Use Copy error details.';}if(e.code==='ACTION_REJECTED'||e.code===4001)return 'Request cancelled in your wallet.';if(e.code==='INSUFFICIENT_FUNDS')return 'Insufficient ETH for the reward and network fee.';if(e.receipt?.status===0)return 'Transaction reverted. Open the transaction link for details. The reward was not deposited; gas may have been charged.';const text=e.reason||e.shortMessage||e.message||'Unable to complete this request.';return String(text).slice(0,220)}

async function transact(promise,message){toast(message+' · Check your wallet');let tx;try{tx=await promise;showTransaction(tx.hash,'Pending confirmation');let receipt;try{receipt=await tx.wait()}catch(e){if(e.code==='TRANSACTION_REPLACED'&&!e.cancelled&&e.receipt){receipt=e.receipt}else{throw e}}if(receipt.status!==1){const error=Error('Transaction reverted.');error.receipt=receipt;throw error;}showTransaction(receipt.hash,'Confirmed on Arbitrum Sepolia');return receipt}catch(e){if(tx)showTransaction(tx.hash,e.code==='TRANSACTION_REPLACED'&&e.cancelled?'Cancelled':e.receipt?'Reverted':'Confirmation unavailable — check explorer before retrying');throw e}}
async function fundStudy(s){const deadline=Math.floor(new Date(s.deadline).getTime()/1000);if(!Number.isFinite(deadline)||deadline<=Date.now()/1000||deadline>Date.now()/1000+90*86400)throw Error('Choose a deadline within the next 90 days.');const {pool,token,decimals,symbol}=await contracts();s.assetDecimals=decimals;s.assetSymbol=symbol;s.owner=account;s.poolAddress=await pool.getAddress();s.tokenAddress=token?await token.getAddress():ZeroAddress;s.chainId=hashText(s.id);const amount=parseUnits(String(s.reward),decimals);if(token&&await token.balanceOf(account)<amount)throw Error('Insufficient '+symbol+' balance.');s.briefHash=hashText(JSON.stringify(s));localStorage.setItem('parry.pendingFunding',JSON.stringify(s));if(!token&&await (await network()).provider.getBalance(account)<amount)throw Error('Insufficient ETH for the reward pool. Keep additional ETH for network fees.');if(token&&await token.allowance(account,s.poolAddress)<amount)await transact(sendWithGas(token.approve,[s.poolAddress,amount]),'Approve reward amount');const receipt=await transact(sendWithGas(pool.fund,[s.chainId,amount,deadline,s.briefHash],token?{}:{value:amount}),'Fund reward pool');s.fundingTx=receipt.hash;localStorage.setItem('parry.pendingFunding',JSON.stringify(s));}
async function mountAwardPicker(s,pool,total,decimals,symbol){
 document.querySelector('#award-panel')?.remove();
 const panel=document.createElement('section');panel.className='panel';panel.id='award-panel';
 const host=document.querySelector('.detail > div');if(!host)return;host.append(panel);
 panel.innerHTML='<h2>Select winners</h2><p class="muted">Checking submitted reviews…</p>';
 const candidates=[],seen=new Set();
 for(const review of state.reviews.filter(r=>r.study===s.id)){
  const wallet=String(review.author||'').toLowerCase();if(!/^0x[a-f0-9]{40}$/.test(wallet)||seen.has(wallet))continue;
  const {contentHash,...content}=review;const calculated=hashText(JSON.stringify(content));
  if(!contentHash||calculated!==contentHash)continue;
  const registered=await pool.submissions(s.chainId,wallet);
  if(registered!==calculated)continue;seen.add(wallet);candidates.push(review);
 }
 if(!panel.isConnected)return;
 panel.innerHTML=`<h2>Select winners</h2><p class="muted">Choose the submissions to reward, then allocate ${formatUnits(total,decimals)} ${esc(symbol)}.</p>${candidates.map((r,i)=>`<div class="winner-row"><label class="winner-choice"><input type="checkbox" data-winner="${i}"><span><strong>${esc(r.title)}</strong><br><small>${esc(r.author.slice(0,6))}…${esc(r.author.slice(-4))}</small></span></label><p>${esc(r.observation)}</p><label>Award (${esc(symbol)})<input data-award="${i}" inputmode="decimal" placeholder="0" disabled aria-label="Award for ${esc(r.title)}"></label></div>`).join('')||'<p>No matching confirmed submissions are available in this browser.</p>'}<div class="row"><span>Remaining to allocate</span><strong id="award-remaining">${formatUnits(total,decimals)} ${esc(symbol)}</strong></div><p id="award-error" role="status" class="mini"></p><div class="actions"><button id="award-split" type="button">Split equally</button><button id="resolve" class="primary" disabled>Confirm awards</button></div><p class="mini muted">Winners claim their awards after confirmation.</p>`;
 panel.awardCandidates=candidates;
 const selected=()=>[...panel.querySelectorAll('[data-winner]:checked')].map(el=>Number(el.dataset.winner));
 function update(){try{const indexes=selected();let sum=0n;let positive=true;for(const i of indexes){const amount=parseUnits(panel.querySelector(`[data-award="${i}"]`).value||'0',decimals);sum+=amount;if(amount<=0n)positive=false}$('#award-remaining').textContent=formatUnits(total-sum,decimals)+' '+symbol;$('#resolve').disabled=!indexes.length||indexes.length>50||!positive||sum!==total;$('#award-error').textContent=sum>total?'Awards exceed the reward pool.':''}catch{$('#resolve').disabled=true;$('#award-error').textContent='Enter valid amounts using the asset’s decimal precision.'}}
 panel.querySelectorAll('[data-winner]').forEach(el=>el.onchange=()=>{panel.querySelector(`[data-award="${el.dataset.winner}"]`).disabled=!el.checked;update()});
 panel.querySelectorAll('[data-award]').forEach(el=>el.oninput=update);
 $('#award-split').onclick=()=>{const indexes=selected();if(!indexes.length){$('#award-error').textContent='Select at least one submission first.';return}const count=BigInt(indexes.length),base=total/count,remainder=total%count;indexes.forEach((i,k)=>{panel.querySelector(`[data-award="${i}"]`).value=formatUnits(base+(BigInt(k)<remainder?1n:0n),decimals)});update()};
}
function selectedAwardRows(){const panel=document.querySelector('#award-panel');if(!panel)throw Error('Select a submission first.');return [...panel.querySelectorAll('[data-winner]:checked')].map(el=>{const i=Number(el.dataset.winner);return [panel.awardCandidates[i].author,panel.querySelector(`[data-award="${i}"]`).value.trim()]})}

async function loadPool(s){const box=$('#chainpanel');box.innerHTML='<p class="mini">Reading reward pool…</p>';try{const provider=new JsonRpcProvider('https://sepolia-rollup.arbitrum.io/rpc',421614,{staticNetwork:true});const pool=new Contract(s.poolAddress,(await artifact('ReviewPool')).abi,provider);const [p,block,asset]=await Promise.all([pool.pools(s.chainId),provider.getBlock('latest'),pool.token()]);const {briefHash,fundingTx,...bound}=s;if(p.briefHash!==hashText(JSON.stringify(bound))||p.creator.toLowerCase()!==s.owner.toLowerCase()||asset.toLowerCase()!==s.tokenAddress.toLowerCase())throw Error('This brief does not match its funded contract record.');const token=asset===ZeroAddress?null:new Contract(asset,['function decimals() view returns(uint8)','function symbol() view returns(string)'],provider);const decimals=token?Number(await token.decimals()):18,symbol=token?await token.symbol():'ETH';const due=account?await pool.claimable(s.chainId,account):0n,now=Number(block.timestamp),deadline=Number(p.deadline);const owner=p.creator.toLowerCase()===account;const status=p.resolved?'Closed · awards or refund recorded':now<deadline?'Funded · Accepting reviews':now<=deadline+604800?'Awaiting awards':'Refund available';if(!box.isConnected)return;box.innerHTML=`<div class="chain-status"><strong>${status}</strong><div>Deposited: ${formatUnits(p.amount,decimals)} ${esc(symbol)}</div><div>Closes: ${new Date(deadline*1000).toLocaleString()}</div><a href="https://sepolia.arbiscan.io/address/${s.poolAddress}" target="_blank" rel="noopener">View contract ↗</a></div>${due>0n?`<button id="claim">Claim ${formatUnits(due,decimals)} ${esc(symbol)}</button>`:''}${owner&&!p.resolved&&now>=deadline&&now<=deadline+604800?'<p class="mini">Select winners below the feedback.</p>':''}${owner&&!p.resolved&&now>deadline+604800?'<button id="refund">Refund unresolved pool</button>':''}`;const submitted=account?await pool.submissions(s.chainId,account):ZeroHash;if(!box.isConnected)return;const join=$('#join');if(join&&box.isConnected){const access=submissionAccess({funded:true,resolved:p.resolved,deadline,timestamp:now},{wallet:account,owner:p.creator,submitted:submitted!==ZeroHash});join.disabled=!access.allowed;join.textContent=access.label}document.querySelector('#award-panel')?.remove();if(owner&&!p.resolved&&now>=deadline&&now<=deadline+604800)await mountAwardPicker(s,pool,p.amount,decimals,symbol);for(const action of ['claim','refund','resolve']){const button=$('#'+action);if(button)button.onclick=async()=>{button.disabled=true;try{const {pool:writer}=await contracts(s);if(action==='resolve'){const current=await writer.pools(s.chainId);if(current.resolved){toast('This pool has already been closed. Refreshing its status.');await loadPool(s);return}if(current.creator.toLowerCase()!==account)throw Error('Connect the creator wallet to allocate awards.');}let args=[s.chainId];if(action==='resolve'){const rows=selectedAwardRows();if(!rows.length||rows.length>50||rows.some(r=>r.length!==2||!/^0x[a-fA-F0-9]{40}$/.test(r[0])))throw Error('Enter valid participant wallets and amounts.');const wallets=rows.map(r=>r[0].toLowerCase()),amounts=rows.map(r=>parseUnits(r[1],decimals));if(new Set(wallets).size!==wallets.length||amounts.some(x=>x<=0n))throw Error('Each winner needs a unique wallet and positive amount.');if(amounts.reduce((a,b)=>a+b,0n)!==p.amount)throw Error('Awards must total exactly '+formatUnits(p.amount,decimals)+' '+symbol);for(const w of wallets)if(await writer.submissions(s.chainId,w)==='0x'+'0'.repeat(64))throw Error('A selected wallet has not submitted to this review.');args=[s.chainId,wallets,amounts]}await transact(sendWithGas(writer[action],args),'Confirm '+action);await loadPool(s)}catch(e){toast(paymentError(e));button.disabled=false}}}}catch(e){if(box.isConnected)box.textContent=e.shortMessage||e.message}}
async function prepareImages(files){if(files.length>3)throw Error('Choose at most 3 screenshots.');const out=[];for(const file of files){if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024)throw Error('Use PNG, JPG or WebP files under 2 MB.');const bitmap=await createImageBitmap(file);const scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=bitmap.width*scale;canvas.height=bitmap.height*scale;canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();out.push({name:file.name,data:canvas.toDataURL('image/jpeg',.75)})}return out}

function howItWorks(){$('#app').innerHTML=`<div class="form"><h1>How Parry works</h1><p class="muted">Product feedback with a funded reward pool.</p><section class="panel"><h2>For product teams</h2><h3>1. Publish a clear brief</h3><p>Describe the product, who should try it, the tasks to complete and what makes a useful review. Add a product link and a submission deadline. State how you will choose winners before collecting feedback.</p><h3>2. Fund the rewards</h3><p>Enter the reward amount and confirm the transaction in your wallet. The contract holds the pool until awards or an eligible refund. ETH funding uses one transaction; supported tokens may first require an approval. A funding link lets you inspect the transaction.</p><h3>3. Review the submissions</h3><p>Only you and each submission’s author can access its text and screenshots. Read the observations and screenshots. Judge specific, original and actionable feedback against the published criteria. A positive rating is not a requirement for an award.</p><h3>4. Select winners</h3><p>After the deadline, allocate the full pool across one or more participants who submitted onchain. Confirm the allocation in your wallet. Winners claim directly from the contract.</p></section><section class="panel"><h2>For reviewers</h2><h3>1. Find a product</h3><p>Browse without connecting. Read the tasks, selection criteria, reward asset and deadline before joining.</p><h3>2. Join and try it</h3><p>Connect your wallet and confirm the sign-in message when you join. Complete the tasks on the linked product. Record what you tried, what happened and what would improve the experience.</p><h3>3. Submit your feedback</h3><p>Add your review, evidence links and up to three screenshots. Funded reviews require a transaction that records your submission fingerprint before the deadline. One submission is allowed per wallet per review.</p><h3>4. Claim an award</h3><p>If selected, your allocation appears as claimable. Confirm the claim transaction to receive the funds. Your profile separates claimable awards from rewards already received.</p></section><section class="panel"><h2>Rewards and decisions</h2><p>The creator selects winners using the published criteria. Participation does not guarantee a reward. Parry does not independently arbitrate review quality. Allocations are final once confirmed.</p><p>If the creator does not resolve the pool within seven days after the submission deadline, the creator can recover the unresolved funds. Allocated awards remain available for winners to claim.</p><p>Wallet addresses are not proof of unique people.</p><p class="mini muted">Transactions currently run on Arbitrum Sepolia with test assets. Network fees require test ETH.</p></section></div>`}

$('#profile-signout')?.addEventListener('click',profileSignOut);$('#profile-auth')?.addEventListener('click',()=>gate(profile));$('#profileconnect')?.addEventListener('click',()=>gate(profile));$('#profileform')?.addEventListener('submit',e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));d.url=validUrl(d.url);profiles[account]=d;localStorage.setItem('parry.profiles',JSON.stringify(profiles));toast('Profile saved');profile()}catch(e){toast(e.message)}});rewardLedger();}

async function rewardLedgerFor(cfg,earnings,wallet){if(!wallet)return;if(!cfg.pool){earnings.textContent='No reward contract configured.';return}try{const provider=new JsonRpcProvider('https://sepolia-rollup.arbitrum.io/rpc',421614,{staticNetwork:true}),pool=new Contract(cfg.pool,(await artifact('ReviewPool')).abi,provider);const asset=await pool.token(),token=asset===ZeroAddress?null:new Contract(asset,['function decimals() view returns(uint8)','function symbol() view returns(string)'],provider),decimals=token?Number(await token.decimals()):18,symbol=token?await token.symbol():'ETH',end=await provider.getBlockNumber();if(!Number.isSafeInteger(cfg.startBlock)||cfg.startBlock<0||cfg.startBlock>end)throw Error('Invalid deployment block');let claimed=0n;const ids=new Set(),transactions=[];for(let from=cfg.startBlock;from<=end;from+=2000){if(!earnings.isConnected||account!==wallet)return;const to=Math.min(end,from+1999);const [claims,submissions]=await Promise.all([pool.queryFilter(pool.filters.Claimed(null,wallet),from,to),pool.queryFilter(pool.filters.Submitted(null,wallet),from,to)]);for(const e of claims){claimed+=e.args.amount;transactions.push({hash:e.transactionHash,amount:e.args.amount})}for(const e of submissions)ids.add(e.args.id)}let pending=0n;for(const key of ids)pending+=await pool.claimable(key,wallet,{blockTag:end});if(!earnings.isConnected||account!==wallet)return;earnings.innerHTML=`<div class="row"><span>Claimed earnings</span><strong>${formatUnits(claimed,decimals)} ${esc(symbol)}</strong></div><div class="row"><span>Claimable rewards</span><strong>${formatUnits(pending,decimals)} ${esc(symbol)}</strong></div>${transactions.slice(-5).reverse().map(t=>`<p><a href="https://sepolia.arbiscan.io/tx/${t.hash}" target="_blank" rel="noopener">Received ${formatUnits(t.amount,decimals)} ${esc(symbol)} ↗</a></p>`).join('')}<details class="mini muted"><summary>Network details</summary>Arbitrum Sepolia · Updated at block ${end}</details>`}catch(e){if(earnings.isConnected)earnings.textContent='Unable to verify earnings right now. No estimated balance is shown.'}}


async function recoverPending(){try{if(!account){gate(recoverPending);return}const s=JSON.parse(localStorage.getItem('parry.pendingFunding')||'null'),r=JSON.parse(localStorage.getItem('parry.pendingReview')||'null');let recovered=false;if(s&&s.owner===account){const {pool}=await contracts(s),p=await pool.pools(s.chainId);if(p.briefHash===s.briefHash&&p.creator.toLowerCase()===account){if(!state.studies.some(x=>x.id===s.id))state.studies.unshift(s);if(save()){localStorage.removeItem('parry.pendingFunding');recovered=true}}}if(r&&r.author===account){const brief=study(r.study);if(brief){const {pool}=await contracts(brief);if(await pool.submissions(brief.chainId,account)===r.contentHash){if(!state.reviews.some(x=>x.id===r.id))state.reviews.push(r);if(save()){localStorage.removeItem('parry.pendingReview');recovered=true}}}}toast(recovered?'Confirmed record recovered.':'No confirmed interrupted record found for this wallet.');render()}catch(e){toast(paymentError(e))}}

function recordWalletFailure(e){const nested=e?.info?.error||e?.error||e?.cause;const report={time:new Date().toISOString(),code:String(e?.code||''),message:String(e?.shortMessage||e?.message||'').slice(0,500),providerCode:String(nested?.code||''),providerMessage:String(nested?.message||'').slice(0,1000),transactionHash:e?.receipt?.hash||e?.transactionHash||null};window.parryLastWalletError=report;let panel=$('#wallet-error-details');if(!panel){panel=document.createElement('div');panel.id='wallet-error-details';panel.className='notice';$('#app').prepend(panel)}panel.innerHTML='<strong>Wallet request could not be completed.</strong><p>Check wallet Activity before retrying.</p><button id="copy-wallet-error">Copy error details</button>';$('#copy-wallet-error').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));toast('Error details copied')}catch{panel.append(document.createTextNode(JSON.stringify(report,null,2)))}};

}

// Parry workflow refresh v1
var challengeSnapshots=new Map(),catalogBusy=false,challengeFilter='all',connectionBusy=false;
var catalogProvider;
function readProvider(){return catalogProvider||(catalogProvider=new JsonRpcProvider('https://sepolia-rollup.arbitrum.io/rpc',421614))}
function currentPhase(s){if(!s.chainId)return 'unfunded';const v=challengeSnapshots.get(s.id);return challengePhase(v,v?(performance.now()-v.checked)/1000:0)}
function phaseBadge(s){const phase=currentPhase(s),label={open:'Open',closed:'Closed',checking:'Checking status',unavailable:'Status unavailable',unfunded:'Not funded'}[phase];return `<span class="phase phase-${phase}"><i></i>${label}</span>`}
async function snapshotFor(s){
 if(!s?.chainId)return {funded:false,timestamp:0,deadline:0,checked:performance.now()};
 const provider=readProvider(),pool=new Contract(s.poolAddress,(await artifact('ReviewPool')).abi,provider);
 const block=await provider.getBlock('latest');const p=await pool.pools(s.chainId,{blockTag:block.number});
 const {briefHash,fundingTx,...bound}=s;
 if(p.creator===ZeroAddress||p.briefHash!==hashText(JSON.stringify(bound))||p.creator.toLowerCase()!==s.owner.toLowerCase())throw Error('Challenge does not match its funding record.');
 return {funded:true,resolved:p.resolved,deadline:Number(p.deadline),timestamp:Number(block.timestamp),checked:performance.now(),owner:p.creator.toLowerCase(),block:block.number};
}
async function refreshCatalog(force=false){
 if(catalogBusy)return;catalogBusy=true;
 try{const list=studies().filter(s=>force||!challengeSnapshots.has(s.id)||performance.now()-challengeSnapshots.get(s.id).checked>30000);
 for(let i=0;i<list.length;i+=4){await Promise.all(list.slice(i,i+4).map(async s=>{try{challengeSnapshots.set(s.id,await snapshotFor(s))}catch{challengeSnapshots.set(s.id,{error:true,checked:performance.now()})}}));if(document.querySelector('#cards'))updateChallengeCards()}
 }finally{catalogBusy=false}
}
function deadlineLabel(s){const snap=challengeSnapshots.get(s.id);if(!snap?.deadline)return 'Deadline loading';return `${currentPhase(s)==='closed'?'Closed':'Closes'} ${new Date(snap.deadline*1000).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`}
function updateChallengeCards(){
 const cards=$('#cards');if(!cards)return;
 const list=catalogueStudies().filter(s=>(filter==='All'||s.type===filter)&&`${s.title} ${s.team}`.toLowerCase().includes(query.toLowerCase())&&(challengeFilter==='all'||currentPhase(s)===challengeFilter));
 cards.innerHTML=list.map(card).join('')||`<div class="empty"><h2>${challengeFilter==='all'?'No challenges found':'No '+challengeFilter+' challenges'}</h2><p>${studies().some(s=>currentPhase(s)==='checking')?'Checking challenge status…':'Try another filter or create a challenge.'}</p></div>`;
 const count=$('#challenge-count');if(count)count.textContent=`${list.length} ${list.length===1?'challenge':'challenges'}`;
}
async function ensureCanSubmit(s){
 if(!s?.chainId)throw Error('This challenge has not been funded.');
 if(!account||privateIdentity!==account||privateExpiry<=Date.now())throw Error('Connect and sign in before submitting.');
 const wallet=account,epoch=privateEpoch,snap=await snapshotFor(s);
 const pool=new Contract(s.poolAddress,(await artifact('ReviewPool')).abi,readProvider());
 const existing=await pool.submissions(s.chainId,wallet);
 if(wallet!==account||epoch!==privateEpoch)throw Error('Wallet changed. Reopen the challenge.');
 challengeSnapshots.set(s.id,snap);
 const access=submissionAccess(snap,{wallet,owner:snap.owner,submitted:existing!==ZeroHash});
 if(!access.allowed)throw Error(access.reason);
 return wallet;
}
async function write(s){
 const route=location.hash;$('#app').innerHTML='<div class="empty" role="status">Checking submission eligibility…</div>';
 try{await ensureCanSubmit(s);if(location.hash!==route)return;renderWriteForm(s);polishPage()}
 catch(e){if(location.hash!==route)return;detail(s);polishPage();toast(e.message)}
}
async function connectAndSignIn(){
 if(connectionBusy)return;connectionBusy=true;const b=$('#connect');b.disabled=true;b.textContent='Connecting…';
 try{
  if(!window.ethereum?.request)throw Error('Open Parry in a browser with an Ethereum wallet installed.');
  const accounts=await window.ethereum.request({method:'eth_requestAccounts'});if(!accounts?.[0])throw Error('No wallet selected.');
  account=accounts[0].toLowerCase();localStorage.removeItem('parry.disconnected');resetPrivateIdentity();updateWalletHeader();b.textContent='Confirm sign-in in wallet…';
  await privateSignIn();if(privateIdentity!==account)throw Error('Sign-in was not completed. Please retry.');
  const fn=pending;$('#wallet').close();if(fn)await fn();else render();toast('Connected and signed in');
 }catch(e){$('#error').textContent=e.code===4001||e.code==='ACTION_REJECTED'?'Request cancelled. You can retry.':e.message}
 finally{connectionBusy=false;b.disabled=false;b.textContent='Connect wallet'}
}

async function restoreWallet(){
 if(localStorage.getItem('parry.disconnected')==='1'||!window.ethereum?.request)return;
 try{const accounts=await window.ethereum.request({method:'eth_accounts'});if(accounts?.[0]){account=accounts[0].toLowerCase();resetPrivateIdentity();render();await privateSignIn();updateWalletHeader()}}catch(e){toast(e.code==='ACTION_REJECTED'||e.code===4001?'Sign-in cancelled. Use Continue sign-in when ready.':e.message)}
}
function polishPage(){
 const route=location.hash.slice(1).split('/')[0]||'explore';
 document.body.dataset.view=route;
 document.querySelectorAll('.nav a:not(.brand)').forEach(a=>{const target=a.getAttribute('href').slice(1)||'explore';if(target===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 const form=$('#newform')||$('#reviewform');
 if(form&&!form.dataset.arranged){form.dataset.arranged='1';form.classList.add('arranged-form');
  const names=form.id==='newform'?['team','title','type','url','description','tasks','audience','criteria','duration','deadline','reward']:['rating','title','observation','suggestion','evidence'];
  for(const name of names){const input=form.elements.namedItem(name);if(input)input.id=input.id||'field-'+name}
  if(form.id==='newform'){
   const groups=[['Product details',['team','title','type','url']],['Review brief',['description','tasks','audience','criteria','duration']],['Prize & deadline',['deadline','reward']]];
   for(const [title,fields] of groups){const first=form.elements.namedItem(fields[0])?.closest('label');if(!first)continue;const section=document.createElement('fieldset');section.innerHTML=`<legend>${title}</legend>`;form.insertBefore(section,first);for(const name of fields){const label=form.elements.namedItem(name)?.closest('label');if(label)section.append(label)}}
  }
 }
 const panel=$('#submission-list');if(panel&&!panel.querySelector('.review')&&privateIdentity!==account){const button=document.createElement('button');button.textContent=account?'Continue sign-in':'Connect wallet';button.onclick=()=>gate(()=>render());panel.append(button)}
}

// Parry practice reviews v4
function practiceKey(s,wallet){return 'parry.practice.v1:'+wallet.toLowerCase()+':'+s.id}
function practiceExists(s){return account&&localStorage.getItem(practiceKey(s,account))!==null}
function practiceDetail(s){
 templateDetail(s);
 const side=$('.detail .side');if(!side)return;
 const button=document.createElement('button');button.className='primary';button.style.marginTop='16px';button.textContent=practiceExists(s)?'Submission received':'Submit review';button.disabled=Boolean(practiceExists(s));
 button.onclick=()=>gate(()=>practiceForm(s));side.append(button);
}
function practiceForm(s){
 if(practiceExists(s)){practiceDetail(s);return}
 const wallet=account;
 $('#app').innerHTML=`<a class="back" href="#review/${encodeURIComponent(s.id)}">← Back to challenge</a><div class="top"><h1>Review ${esc(s.team)}</h1></div><section class="panel"><p class="mini muted">Practice submission, saved in this browser. Illustrative prize; no payout.</p><form id="practice-form"><label>Your experience<textarea name="experience" required maxlength="4000" placeholder="What worked, and where did you get stuck?"></textarea></label><label>Suggested improvement<textarea name="suggestion" required maxlength="4000" placeholder="What would you change and why?"></textarea></label><label>Screenshots<input name="screenshots" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><p class="mini muted">Up to 2 images, 1 MB each.</p><p id="practice-error" role="alert"></p><button class="primary" type="submit">Submit review</button></form></section>`;
 $('#practice-form').onsubmit=async e=>{
 e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;
 try{
 if(account!==wallet||!wallet)throw Error('Your wallet changed. Open the challenge again.');
 if(practiceExists(s))throw Error('You already submitted a review for this challenge.');
 const files=[...form.elements.screenshots.files];if(files.length>2)throw Error('Choose up to two screenshots.');
 const screenshots=await Promise.all(files.map(file=>{if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1024*1024)throw Error('Use PNG, JPEG or WebP images under 1 MB.');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Could not read screenshot.'));reader.readAsDataURL(file)})}));
 if(account!==wallet)throw Error('Your wallet changed. Please reopen the challenge.');
 const experience=form.elements.experience.value.trim(),suggestion=form.elements.suggestion.value.trim();if(!experience||!suggestion)throw Error('Complete both review fields.');
 const save=()=>{const key=practiceKey(s,wallet);if(localStorage.getItem(key)!==null)throw Error('You already submitted to this challenge.');localStorage.setItem(key,JSON.stringify({wallet,challenge:s.id,experience,suggestion,screenshots,createdAt:new Date().toISOString()}))};
 if(navigator.locks)await navigator.locks.request(practiceKey(s,wallet),save);else save();
 practiceDetail(s);toast('Practice review saved in this browser.');
 }catch(error){const target=$('#practice-error');if(target)target.textContent=error.name==='QuotaExceededError'?'Browser storage is full. Try smaller screenshots.':error.message;button.disabled=false}
 };
}

// Parry prize details v3
function winnerLabel(s){
 const planned={northstar:3,folio:3,atlas:3,nova:5};
 if(s.example)return `${planned[s.id]||3} planned winners`;
 return 'Winners selected by creator';
}
// Parry profile and catalogue v2
function updateWalletHeader(){
 const button=$('#header-connect');if(!button)return;button.textContent=account?'Profile':'Connect wallet';button.title=account?'Profile, wallet and sign out':'Connect and sign in';
 button.onclick=()=>{if(account){location.hash='profile';if(location.hash==='#profile')render()}else gate(()=>location.hash='profile')};
}
function detail(s){if(s?.example)return practiceDetail(s);return fundedDetail(s)}
function templateDetail(s){
 $('#app').innerHTML=`<a class="back" href="#">← All challenges</a><div class="top"><div><small>${esc(s.team)} / ${esc(s.type)}</small><h1>${esc(s.title)}</h1></div><span class="phase">Open</span></div><div class="detail"><section class="panel"><h2>About this challenge</h2><p>${esc(s.description)}</p><h3>What to try</h3><ol>${s.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><h3>Who should participate</h3><p>${esc(s.audience)}</p><h3>Selection criteria</h3><p>${esc(s.criteria)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener">Open product ↗</a></section><aside class="panel side"><small>Proposed prize pool</small><h1>${Number(s.reward).toLocaleString('en-US')} USDG</h1><p><strong>${winnerLabel(s)}</strong></p><p class="mini muted">Illustrative prize; no payout. Practice reviews stay in this browser.</p><a class="primary" href="${esc(s.url)}" target="_blank" rel="noopener">Explore product ↗</a></aside></div>`;
}
function create(){renderCreateForm()}
async function profileSignOut(){
 const button=$('#profile-signout');if(button)button.disabled=true;
 account='';resetPrivateIdentity();localStorage.setItem('parry.disconnected','1');render();
 try{const response=await fetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!response.ok)throw Error('The server could not end the session.');toast('Signed out')}catch(e){toast('Wallet disconnected. Server sign-out could not be confirmed.')}finally{updateWalletHeader()}
}

restoreWallet();
addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
// Private submissions v1: authenticated reads, author-only uploads, no fetched review cache.
var privacyReady=true,privateWallet='',privateIdentity='',privateExpiry=0,privateEpoch=0,sharedQueue=Promise.resolve(),signing=null;
var privateOutbox=[];
try{privateOutbox=JSON.parse(localStorage.getItem('parry.private-outbox')||'[]')}catch{}
for(const r of state.reviews||[])if(!privateOutbox.some(x=>x.id===r.id))privateOutbox.push(r);
localStorage.setItem('parry.private-outbox',JSON.stringify(privateOutbox));
state.reviews=[];
localStorage.setItem('parry.v1',JSON.stringify({...state,reviews:[]}));
function cachePrivateState(){
 for(const r of state.reviews.filter(x=>x.author?.toLowerCase()===account.toLowerCase()))if(!privateOutbox.some(x=>x.id===r.id))privateOutbox.push(r);
 localStorage.setItem('parry.private-outbox',JSON.stringify(privateOutbox));
 localStorage.setItem('parry.v1',JSON.stringify({...state,reviews:[]}));
}
function resetPrivateIdentity(){
 if(!privacyReady)return;
 const current=account.toLowerCase();
 if(current!==privateWallet){privateWallet=current;privateIdentity='';privateExpiry=0;privateEpoch++;state.reviews=[];setTimeout(()=>syncShared(),0)}
 if(privateIdentity&&privateExpiry<=Date.now()){privateIdentity='';privateEpoch++;state.reviews=[]}
 const button=document.querySelector('#private-signin');
 if(button){button.hidden=true;button.textContent='Sign in';button.disabled=!!signing}
}
async function privateRequest(path,options={},wallet=account){
 const response=await fetch(path,{...options,credentials:'same-origin',headers:{...options.headers,'X-Parry-Wallet':wallet||''}});
 const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to save.');return data;
}
async function privateSignIn(){
 resetPrivateIdentity();if(!account)throw Error('Connect your wallet first.');
 if(privateIdentity===account&&privateExpiry>Date.now())return syncShared(true);
 if(signing)return signing;
 const wallet=account,epoch=privateEpoch;
 signing=(async()=>{
  let session=await privateRequest('/api/auth/session',{},wallet);
  if(session.address!==wallet){
   const challenge=await privateRequest('/api/auth/challenge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:wallet})},wallet);
   if(account!==wallet||privateEpoch!==epoch)throw Error('Wallet changed. Sign in again.');
   const signer=await new BrowserProvider(window.ethereum).getSigner();
   if((await signer.getAddress()).toLowerCase()!==wallet)throw Error('Wallet changed. Sign in again.');
   const signature=await signer.signMessage(challenge.message);
   if(account!==wallet||privateEpoch!==epoch)throw Error('Wallet changed. Sign in again.');
   session=await privateRequest('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nonce:challenge.nonce,signature})},wallet);
  }
  if(account!==wallet||privateEpoch!==epoch)return;
  privateIdentity=session.address;privateExpiry=session.expires;updateWalletHeader();localStorage.setItem('parry.auth-event',String(Date.now()));await syncShared(true);render();
 })().finally(()=>{signing=null;resetPrivateIdentity()});resetPrivateIdentity();return signing;
}
function syncShared(publish=true){
 const wallet=account,epoch=privateEpoch;
 sharedQueue=sharedQueue.catch(()=>{}).then(async()=>{
  if(epoch!==privateEpoch||wallet!==account)return;
  try{
   const session=wallet?await privateRequest('/api/auth/session',{},wallet):{address:null};
   if(epoch!==privateEpoch||wallet!==account)return;
   privateIdentity=session.address===wallet?wallet:'';privateExpiry=session.expires||0;
   if(publish&&privateIdentity){
    for(const record of state.studies.filter(s=>s.chainId&&s.owner?.toLowerCase()===wallet)){
     if(epoch!==privateEpoch)return;
     await privateRequest('/api/workspace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'studies',record})},wallet);
    }
    for(const record of privateOutbox.filter(r=>r.contentHash&&r.author?.toLowerCase()===wallet)){
     if(epoch!==privateEpoch)return;
     await privateRequest('/api/workspace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'reviews',record})},wallet);
    }
   }
   const remote=await privateRequest('/api/workspace',{},wallet);
   if(epoch!==privateEpoch||wallet!==account)return;
   const ids=new Set(remote.studies.map(x=>x.id));state.studies=[...remote.studies,...state.studies.filter(x=>!ids.has(x.id))];
   privateOutbox=privateOutbox.filter(r=>!remote.reviews.some(x=>x.id===r.id&&x.contentHash===r.contentHash));
   localStorage.setItem('parry.private-outbox',JSON.stringify(privateOutbox));
   state.reviews=privateIdentity===wallet&&wallet?remote.reviews:[];
   localStorage.setItem('parry.v1',JSON.stringify({...state,reviews:[]}));
   if(!document.querySelector('#newform,#reviewform,#profileform'))render();
   resetPrivateIdentity();
  }catch(e){if(epoch===privateEpoch){toast(e.message+' Your unsent copy is retained.');resetPrivateIdentity()}}
 });return sharedQueue;
}
var privateButton=document.createElement('button');privateButton.id='private-signin';privateButton.textContent='Sign in';privateButton.hidden=true;
privateButton.onclick=()=>privateSignIn().catch(e=>toast(e.code===4001||e.code==='ACTION_REJECTED'?'Sign-in cancelled.':e.message));// Sign-in is part of the connection flow; no separate header button.
resetPrivateIdentity();syncShared();
addEventListener('hashchange',()=>syncShared());
setInterval(()=>{if(document.querySelector('#cards'))refreshCatalog()},30000);
setInterval(()=>{if(privateIdentity&&privateExpiry<=Date.now()){resetPrivateIdentity();render()}},1000);

addEventListener('storage',e=>{if(e.key==='parry.auth-event'||e.key==='parry.disconnected'){privateEpoch++;privateIdentity='';privateExpiry=0;state.reviews=[];if(e.key==='parry.disconnected'&&e.newValue==='1')account='';render();syncShared()}});

</script></html>
