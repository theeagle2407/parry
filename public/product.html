<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar · Booking test</title><style>body{font:16px/1.6 system-ui;color:#173d3b;background:#f5f9f7;max-width:650px;margin:60px auto;padding:20px}main{background:white;padding:35px;border:1px solid #dde7e2;border-radius:14px}label{display:block;margin-top:20px}input,select,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;border:1px solid #ccdcd4;border-radius:7px}button{margin-top:25px;background:#087d73;color:white}small{color:#637b73}a{color:#087d73}</style><main><small>Fictional product · No real booking</small><h1>Book a consultation</h1><p>Choose a service and time. Use fictional details to try the confirmation flow.</p><form><label>Service<select><option>Product consultation · 30 minutes</option><option>Design review · 45 minutes</option></select></label><label>Available time<select><option>Tomorrow · 10:00 AM</option><option>Tomorrow · 2:00 PM</option><option>Friday · 11:00 AM</option></select></label><label>Name<input required autocomplete="off" placeholder="Test participant"></label><button>Confirm booking</button></form><p id="result" role="status"></p><a href="/">Return to Parry</a></main><script>const mode=new URLSearchParams(location.search).get('mode');if(mode==='folio'){document.querySelector('h1').textContent='Set up your workspace';document.querySelector('p').textContent='Choose your workspace purpose and a layout. Use a fictional name to try setup.';document.querySelector('form').innerHTML='<label>Workspace name<input required placeholder="My portfolio"></label><label>Purpose<select><option>Portfolio</option><option>Client projects</option></select></label><label>Layout<select><option>Gallery</option><option>List</option></select></label><button>Create workspace</button>';}if(mode==='atlas'){document.querySelector('h1').textContent='Recover your account';document.querySelector('p').textContent='Try a fictional recovery flow. Do not enter a real password, seed phrase or verification code.';document.querySelector('form').innerHTML='<label>Recovery method<select><option>Backup email</option><option>Support request</option></select></label><label>Test account name<input required placeholder="test-user"></label><button>Continue</button>';}if(mode==='nova'){document.querySelector('h1').textContent='Vault integration brief';document.querySelector('p').textContent='The proposed interface promises immediate withdrawal. The fictional vault specification requires a 24-hour withdrawal request before funds can be claimed. Explain the mismatch and suggest an appropriate interface.';document.querySelector('form').remove();}if(document.querySelector('form'))document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#result').textContent=mode==='folio'?'Your workspace setup is complete. This test does not create an account.':mode==='atlas'?'Recovery request received. This test does not send a message.':'Your test booking is confirmed. No appointment was created and no message was sent.'}</script></html>
